[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-vector-exchange"
version = "0.1.0"
description = "Lightweight shared peer vector memory synchronizer with delta replication"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-vector-exchange = "swarm_vector_exchange.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_vector_exchange*"]
